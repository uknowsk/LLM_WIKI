[project]
name = "llmwiki"
version = "0.1.0"
description = "On-prem company LLM wiki (Karpathy-style, Obsidian-compatible vault)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
prod = ["waitress>=3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
